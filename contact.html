<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="static/css/contact.css" />
    <link rel="stylesheet" href="static/css/color.css" />
    <link rel="stylesheet" href="static/css/mode.css">
    <title>Contact</title>
  </head>
  <body>
    <div class="count">
      <header>
        <div class="logo">
          <a href="index.html"><h1>Exit Zero</h1></a>
        </div>
      </header>
      <main>
        <div class="formbox">
          <div class="title">
            <h1>
              Sending Email To Exit Zero
              <span class="dots"></span>
              <span class="dots"></span>
              <span class="dots"></span>
            </h1>
          </div>
          <form>
            <div class="name-email">
              <div class="email-box">
                <input
                  type="email"
                  class="email"
                  id="email"
                  placeholder="Email"
                />
                <label for="email">Email</label>
              </div>
              <div class="name-box">
                <input type="text" class="name" id="name" placeholder="Name" />
                <label for="name">Name</label>
              </div>
            </div>
            <div class="project">
              <textarea
                name="project"
                id="project"
                cols="30"
                rows="10"
                placeholder="Your Project"
              ></textarea>
              <label for="project">Enter your project</label>
            </div>
            <div class="button">
              <button type="submit" class="btn">Send Email</button>
            </div>
          </form>
          <div class="end" id="down">
            <a
              href="https://github.com/endjackcho"
              style="--clr: rgb(165, 42, 42)"
              ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              style="fill: rgb(165, 42, 42); transform: scale(1.5)"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M12.026 2c-5.509 0-9.974 4.465-9.974 9.974 0 4.406 2.857 8.145 6.821 9.465.499.09.679-.217.679-.481 0-.237-.008-.865-.011-1.696-2.775.602-3.361-1.338-3.361-1.338-.452-1.152-1.107-1.459-1.107-1.459-.905-.619.069-.605.069-.605 1.002.07 1.527 1.028 1.527 1.028.89 1.524 2.336 1.084 2.902.829.091-.645.351-1.085.635-1.334-2.214-.251-4.542-1.107-4.542-4.93 0-1.087.389-1.979 1.024-2.675-.101-.253-.446-1.268.099-2.64 0 0 .837-.269 2.742 1.021a9.582 9.582 0 0 1 2.496-.336 9.554 9.554 0 0 1 2.496.336c1.906-1.291 2.742-1.021 2.742-1.021.545 1.372.203 2.387.099 2.64.64.696 1.024 1.587 1.024 2.675 0 3.833-2.33 4.675-4.552 4.922.355.308.675.916.675 1.846 0 1.334-.012 2.41-.012 2.737 0 .267.178.577.687.479C19.146 20.115 22 16.379 22 11.974 22 6.465 17.535 2 12.026 2z"
              ></path></svg
            ></a
            >
            <a href="https://t.me/jasonxhere" style="--clr: rgb(84, 36, 255)"
              ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              style="fill: rgb(0, 0, 255); transform: scale(1.5)"
            >
              <path
                d="m20.665 3.717-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"
              ></path></svg
            ></a
            >
          </div>
        </div>
      </main>
    </div>
    <div class="arrow">
      <a href="#down">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          style="fill: var(--slate); transform: scale(2) ;"
        >
          <path
            d="m18.707 12.707-1.414-1.414L13 15.586V6h-2v9.586l-4.293-4.293-1.414 1.414L12 19.414z"
          ></path>
        </svg>
      </a>
    </div>


    <script>
      const link = document.getElementById("down");
      const arr = document.querySelector(".arrow");
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if(entry.isIntersecting){
            arr.style.transform = "translateX(100px)"
          }else{
            arr.style.transform = "translateX(0)"
          }
        });
      });
      observer.observe(link)
    </script>
    <script src="static/js/theme.js" defer></script>
  </body>
</html>
